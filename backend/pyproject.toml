[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "bcrypt>=4.0.0",
    "fastapi[standard]>=0.139.0",
    "passlib>=1.7.4",
    "pyjwt[crypto]>=2.10.0",
    "python-magic>=0.4.27",
    "sqlmodel>=0.0.39",
]

[tool.ty.environment]
python=".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "-v",
    "--import-mode=importlib",
    "--cov=app",
    "--cov-report=term-missing"
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-depends>=1.0.1",
]
